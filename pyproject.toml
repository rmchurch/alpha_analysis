[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha_analysis"
version = "0.0.0"
description = "Small utilities for alpha analysis and Poincare plotting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "unyt",
    "xarray",
    "tqdm",
    "scipy",
    "optax",
    "h5py",
    "desc-opt",
    "booz-xform",
    "findiff",
    "gitpython",
]
[project.urls]
"Homepage" = "https://example.org/alpha_analysis"

[project.scripts]
run-poincare = "alpha_analysis.workflow.gui_poincare:main"
train-alpha-transolver = "alpha_analysis.ai.train_transolver:main"
train-alpha-transolver-timedependent = "alpha_analysis.ai.train_transolver_timedependent:main"
export-alpha-transolver-slice-tokens = "alpha_analysis.ai.export_transolver_slice_tokens:main"
train-alpha-latent-generator = "alpha_analysis.ai.train_latent_generator:main"

# Explicit package discovery to ensure all modules are included when building wheels.
[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_analysis", "alpha_analysis.*"]
exclude = ["tests", "docs", "examples"]

# Optionally include package data (if later you add data files and MANIFEST.in entries)
[tool.setuptools]
zip-safe = false
