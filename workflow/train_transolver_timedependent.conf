# Training settings for train_transolver_timedependent.sbatch.
#
# Edit this file for routine experiment changes, then submit with:
#   sbatch workflow/train_transolver_timedependent.sbatch
#
# Slurm resources (GPU count, CPUs, memory, and wall time) remain in the
# #SBATCH header at the top of the .sbatch file.

# Paths. REPO_ROOT and SLURM_JOB_ID are defined before this file is loaded.
RESULTS_ROOT="${REPO_ROOT}/../results/G1600"
SAVE_DIR="${REPO_ROOT}/runs/transolver_alpha_timedependent/${SLURM_JOB_ID}"
TRAIN_FOLDERS="${REPO_ROOT}/runs/frame_autoencoder/56011733/train_folders.txt"
VAL_FOLDERS="${REPO_ROOT}/runs/frame_autoencoder/56011733/val_folders.txt"

# DataLoader settings. Batch size is per GPU; with four GPUs, 2 gives a global
# batch size of 8.
BATCH_SIZE_PER_GPU=8
NUM_WORKERS_PER_GPU=4

# Temporal forecasting and training settings.
INPUT_FRAMES=1
OUTPUT_FRAMES=1
MAX_NODES=171462
EPOCHS=400

# Python environment.
ANACONDA_MODULE="anaconda3/2025.6"
ALPHA_ENV="torch-stellar"

# Add less-common trainer options here, for example:
# EXTRA_TRAIN_ARGS=(--lr 5e-5 --save-every 20)
EXTRA_TRAIN_ARGS=()
